name: musicrights
services:
  musicrights-db:
    image: mariadb:11.3.2
    container_name: musicrights-db
    restart: always
    environment:
      MARIADB_USER: $MARIADB_USER
      MARIADB_PASSWORD: $MUSICRIGHTS_DATABASE_PASSWORD
      MARIADB_DATABASE: $MARIADB_DATABASE
      MARIADB_ROOT_PASSWORD: $MARIADB_ROOT_PASSWORD
    volumes:
      - musicrights-db-data:/var/lib/mysql
    healthcheck:
      test: [ CMD, healthcheck.sh, --connect, --innodb_initialized ]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - network-musicrights

  musicrights-api:
    build: .
    image: musicrights-api
    container_name: musicrights-api
    ports:
      - "8085:8085"
    depends_on:
      musicrights-db:
        condition: service_healthy
    environment:
      # Tus variables originales de la base de datos se quedan igual:
      MUSICRIGHTS_DATABASE_PASSWORD: $MUSICRIGHTS_DATABASE_PASSWORD
      SPRING_PROFILES_ACTIVE: $PROFILE

      # Añadimos estas tres para que el SDK de AWS lea el token de Vocareum:
      AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
      AWS_SESSION_TOKEN: $AWS_SESSION_TOKEN
    # El volumen de ${HOME}/.aws lo hemos borrado porque ya no hace falta
    networks:
      - network-musicrights

volumes:
  musicrights-db-data:

networks:
  network-musicrights:
    driver: bridge