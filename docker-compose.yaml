name: musicrights
services:
  musicrights-db:
    image: mariadb:11.3.2
    container_name: musicrights-db
    restart: always
    environment:
      MARIADB_USER: $MARIADB_USER
      MARIADB_PASSWORD: $MUSICRIGHTS_DATABASE_PASSWORD
      MARIADB_DATABASE: $MARIADB_DATABASE
      MARIADB_ROOT_PASSWORD: $MARIADB_ROOT_PASSWORD
    volumes:
      - musicrights-db-data:/var/lib/mysql
    healthcheck:
      test: [ CMD, healthcheck.sh, --connect, --innodb_initialized ]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - network-musicrights

  musicrights-api:
    build: .
    image: musicrights-api
    container_name: musicrights-api
    ports:
      - "8085:8085"
    depends_on:
      musicrights-db:
        condition: service_healthy
    environment:
      MUSICRIGHTS_DATABASE_PASSWORD: $MUSICRIGHTS_DATABASE_PASSWORD
      SPRING_PROFILES_ACTIVE: $PROFILE
    volumes:
      # Monta las credenciales de AWS del host dentro del contenedor (solo lectura).
      # El contenedor corre como root, así que su home es /root.
      - ${HOME}/.aws:/root/.aws:ro
    networks:
      - network-musicrights

volumes:
  musicrights-db-data:

networks:
  network-musicrights:
    driver: bridge