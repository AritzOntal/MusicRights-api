name: musicRights
services:
  musicricghts-db:
    image: mariadb:11.3.2
    container_name: musicrights-db
    restart: always
    environment:
      MYSQL_USER: $MARIADB_USER
      MYSQL_PASSWORD: $MUSICRIGHTS_DATABASE_PASSWORD
      MYSQL_DATABASE: $MARIADB_DATABASE
      MYSQL_PORT: 3306
      MYSQL_ROOT_PASSWORD: $MARIADB_ROOT_PASSWORD
    ports:
      - "3306:3306"
    healthcheck:
      test: [ CMD, healthcheck.sh, --connect, --innodb_initialized ]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - network-musicrights
  musicrights-api:
    image: musicrights-api
    container_name: musicrights-api
    ports:
      - "8085:8085"
    depends_on:
      musicricghts-db:
        condition: service_healthy
    environment:
      MUSICRIGHTS_DATABASE_PASSWORD: $MUSICRIGHTS_DATABASE_PASSWORD
      SPRING_PROFILES_ACTIVE: $PROFILE
    networks:
      - network-musicrights
networks:
  network-musicrights:
    driver: bridge