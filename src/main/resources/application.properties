server.port=8085
spring.application.name=MusicRights
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.profiles.active=prod
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# AWS S3 (las credenciales las toma el SDK de la cadena por defecto:
# variables AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY o ~/.aws/credentials)
aws.s3.bucket=${AWS_S3_BUCKET:music-rights-pdf}
aws.s3.region=${AWS_S3_REGION:us-east-1}

